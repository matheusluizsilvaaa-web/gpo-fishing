name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Locate project
        run: |
          if [ -f settings.gradle ]; then
            echo "PROJ=." >> "$GITHUB_ENV"
          else
            Z=$(ls ./*.zip | head -n1)
            echo "Unzipping $Z"
            mkdir -p _proj
            unzip -q "$Z" -d _proj
            S=$(find _proj -name settings.gradle | head -n1)
            echo "PROJ=$(dirname "$S")" >> "$GITHUB_ENV"
          fi

      - name: Build debug APK
        run: cd "$PROJ" && gradle assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp "$PROJ"/app/build/outputs/apk/debug/*.apk out/GPOFishingAndroid.apk
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: GPOFishingAndroid-apk
          path: out/GPOFishingAndroid.apk

      - name: Publish release (direct APK download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: APK build ${{ github.run_number }}
          files: out/GPOFishingAndroid.apk
